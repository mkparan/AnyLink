<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- bootstrap css -->
    <link rel="stylesheet" href="assets/vendor/css/bootstrap.min.css" />
    <title>AnyLink</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">AnyLink</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://github.com/mkparan/AnyLink"
                >GitHub</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Disabled</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8 text-center">
          <h1 class="mb-3">Welcome to AnyLink</h1>
          <p class="text-muted">Your All in One Video Link Downloader.</p>

          <form class="input-group mx-auto mt-4" style="max-width: 36rem">
            <input
              type="url"
              class="form-control"
              placeholder="Paste your video link here"
              aria-label="Paste your video link here"
              required
            />
            <button type="submit" class="btn btn-secondary">Download</button>
          </form>
        </div>
      </div>
    </main>

    <script src="assets/vendor/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
