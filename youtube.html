<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- bootstrap css -->
    <link rel="stylesheet" href="assets/vendor/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>AnyLink</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">AnyLink</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://github.com/mkparan/AnyLink"
                >GitHub</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Disabled</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/index.html">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Youtube</li>
        </ol>
      </nav>
      <div class="row justify-content-center">
        <div class="col-lg-8 text-center">
          <h1 class="mb-3">Download Youtube Videos</h1>
          <p class="text-muted">
            Easily download videos from Youtube with AnyLink.
          </p>

          <form
            id="download-form"
            class="input-group mx-auto mt-4"
            style="max-width: 36rem"
          >
            <input
              id="video-url"
              name="url"
              type="url"
              class="form-control"
              placeholder="Paste your video link here"
              aria-label="Paste your video link here"
              required
            />
            <button type="submit" class="btn btn-secondary">Download</button>
          </form>
          <div id="status-message" class="mt-3 text-muted"></div>
        </div>
      </div>

      <div class="text-center mt-5">
        <a href="/facebook.html"
          ><button type="button" class="btn btn-primary btn-sm">
            <i class="fa-brands fa-facebook me-2"></i>Facebook
          </button></a
        >
        <a href="/tiktok.html"
          ><button type="button" class="btn btn-secondary btn-sm">
            <i class="fa-brands fa-tiktok me-2"></i>TikTok
          </button></a
        >
        <a href="/youtube.html"
          ><button type="button" class="btn btn-danger btn-sm">
            <i class="fa-brands fa-youtube me-2"></i>YouTube
          </button></a
        >
        <a href="/instagram.html"
          ><button type="button" class="btn btn-dark btn-sm">
            <i class="fa-brands fa-instagram me-2"></i>Instagram
          </button></a
        >
      </div>

      <br />

      <hr />

      <section id="about" class="about section">
        <div class="row justify-content-center">
          <div class="col-lg-8 text-center">
            <h3 class="mb-3">About AnyLink</h3>
            <p class="text-muted">
              AnyLink is a simple and efficient video link downloader that
              allows you to download videos from various platforms with ease.
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="assets/vendor/js/bootstrap.bundle.min.js"></script>
    <script>
      const form = document.getElementById("download-form");
      const urlInput = document.getElementById("video-url");
      const status = document.getElementById("status-message");
      const apiPort = "5000";

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const url = urlInput.value.trim();

        if (!url) {
          status.textContent = "Please enter a video URL.";
          return;
        }

        if (window.location.port !== apiPort) {
          status.textContent = `Please open this page through the Flask server at http://127.0.0.1:${apiPort}`;
          return;
        }

        status.textContent = "Preparing your download...";

        try {
          const response = await fetch(`/download`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ url }),
          });

          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(data.error || "Download failed.");
          }

          status.innerHTML = `Download ready. <a href="${data.download_url}" target="_blank" rel="noopener">Save video</a>`;
        } catch (error) {
          status.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
